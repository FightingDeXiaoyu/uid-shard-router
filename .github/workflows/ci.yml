name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile sources and self-tests
        run: |
          mkdir -p out
          javac -d out $(find src/main/java -name "*.java") $(find src/test/java -name "*.java")
      - name: Run self-tests
        run: java -cp out io.github.fightingdexiaoyu.uidshardrouter.UidShardRouterSelfTest
